{% extends "base.html" %}

{% block title %}Tilbakestill passord — Velunt{% endblock %}

{% block content %}
<article>
    <header>
        <h1>Tilbakestill passord</h1>
    </header>
    <p>Oppgi e-postadressen din, så sender vi deg en lenke for å tilbakestille passordet.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Send tilbakestillingslenke</button>
    </form>
</article>
{% endblock %}
