{% extends "base.html" %}

{% block title %}Nytt passord — Velunt{% endblock %}

{% block content %}
<article>
    <header>
        <h1>Velg nytt passord</h1>
    </header>
    {% if validlink %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Lagre nytt passord</button>
        </form>
    {% else %}
        <p>Denne tilbakestillingslenken er ugyldig eller utløpt. Prøv å be om en ny.</p>
    {% endif %}
</article>
{% endblock %}
