{% load static %}
<!DOCTYPE html>
<html lang="nb">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Velunt{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'vendor/pico.min.css' %}">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <style>
        @media (max-width: 576px) {
            .container { padding-inline: 0.5rem; }
        }
        .event-status-pill {
            display: inline-block;
            padding: 0.1rem 0.4rem;
            border-radius: 1rem;
            font-size: 0.7rem;
            font-weight: 600;
            color: #fff;
        }
        .event-status-open { background: var(--pico-ins-color, #2e7d32); }
        .event-status-closed { background: var(--pico-del-color, #c62828); }
        .event-status-not-yet-open { background: var(--pico-muted-color); }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <script src="{% static 'vendor/htmx.min.js' %}"></script>
    <script>
        document.body.addEventListener('htmx:configRequest', function(event) {
            event.detail.headers['X-CSRFToken'] =
                document.querySelector('meta[name="csrf-token"]').content;
        });
        function autoSizeTextareas(root) {
            root.querySelectorAll('textarea').forEach(function(ta) {
                ta.style.height = 'auto';
                ta.style.height = ta.scrollHeight + 'px';
            });
        }
        document.addEventListener('DOMContentLoaded', function() {
            autoSizeTextareas(document);
        });
        document.body.addEventListener('htmx:afterSettle', function(event) {
            autoSizeTextareas(event.detail.elt);
        });
        /* Animate details close: intercept click, play animation, then close */
        document.body.addEventListener('click', function(event) {
            var summary = event.target.closest('.score-line[open] > summary');
            if (!summary) return;
            var details = summary.parentElement;
            var expanded = details.querySelector('.score-line-expanded');
            if (!expanded) return;
            event.preventDefault();
            expanded.style.animation = 'slide-up 0.2s ease-in forwards';
            expanded.addEventListener('animationend', function() {
                details.removeAttribute('open');
                expanded.style.animation = '';
            }, {once: true});
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
