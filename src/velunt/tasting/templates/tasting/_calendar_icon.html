<div class="event-calendar" role="img" aria-label="{{ date|date:'j. F Y' }}">
    <div class="event-calendar-month" aria-hidden="true">{{ date|date:"M" }}</div>
    <div class="event-calendar-day" aria-hidden="true">{{ date|date:"j" }}</div>
    <div class="event-calendar-year" aria-hidden="true">{{ date|date:"Y" }}</div>
</div>
