[project]
name = "velunt"
version = "0.1.0"
description = "Beer tasting event management system"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "Django>=5.2,<6",
    "django-htmx",
    "psycopg[binary]",
    "qrcode[pil]",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "pytest-django",
    "ruff",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "velunt.settings"
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["BLE001", "E4", "E501", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "preserve"
